<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d29">
<meta name="robots" content="noindex, nofollow">
<title>Admin Hub – RaiKrish's Collection</title>
<link rel="icon" href="https://drive.google.com/thumbnail?id=1zqOu2NPiGQ4MZT6rxNwbzn_7csTxUQpD&sz=s800">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#0b3d29; --green-2:#14573b; --green-3:#0e4a32; --gold:#c9a24b; --gold-soft:#f1e3bd;
  --cream:#faf6ec; --ink:#1d2b24; --muted:#6b7a72; --line:#e6dfcd; --bad:#b3361f;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;font-family:var(--sans);color:var(--ink);line-height:1.45;display:flex;flex-direction:column;
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(201,162,75,.18), transparent 60%),
    radial-gradient(700px 500px at -10% 110%, rgba(20,87,59,.16), transparent 60%),
    var(--cream)}
button{font-family:inherit;cursor:pointer}
a{color:inherit}

/* Top bar */
.topbar{background:var(--green);color:#fff;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
.logo{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid var(--gold);flex:none}
.brand b{font-family:var(--serif);font-size:1.05rem;display:block;line-height:1.15}
.brand small{color:var(--gold);letter-spacing:.16em;text-transform:uppercase;font-size:.62rem;font-weight:600}
.spacer{flex:1}
.who{font-size:.82rem;color:var(--gold-soft);white-space:nowrap}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:8px 14px;font-size:.82rem;font-weight:500}
.btn-ghost:hover{background:rgba(255,255,255,.12)}

main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:26px max(16px,env(safe-area-inset-right)) 30px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;justify-content:center}

/* Login card */
.login{width:100%;max-width:410px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;
  box-shadow:0 30px 60px -28px rgba(11,61,41,.5);animation:rise .4s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.login-head{background:linear-gradient(160deg,var(--green) 0%,var(--green-2) 100%);color:#fff;text-align:center;padding:30px 24px 26px;position:relative}
.login-head::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.login-head img{width:92px;height:92px;border-radius:50%;object-fit:cover;background:#fff;border:3px solid var(--gold);box-shadow:0 10px 24px rgba(0,0,0,.3)}
.login-head h1{font-family:var(--serif);font-size:1.5rem;margin:14px 0 2px}
.login-head p{margin:0;color:var(--gold-soft);font-size:.86rem}
.login-body{padding:24px 24px 8px}
.field{margin-bottom:14px}
.field label{display:block;font-size:.74rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.inp{position:relative}
.inp svg.ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.inp input{width:100%;padding:13px 44px 13px 42px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
.inp input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(20,87,59,.15)}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;width:36px;height:36px;border-radius:50%;color:var(--muted);display:grid;place-items:center}
.eye:hover{background:#f3efe2}
.eye svg{width:19px;height:19px}
.btn-primary{width:100%;background:var(--green);color:#fff;border:none;border-radius:12px;padding:14px;font-size:1rem;font-weight:600;transition:.15s;margin-top:4px}
.btn-primary:hover:not(:disabled){background:var(--green-2)}
.btn-primary:disabled{opacity:.55;cursor:not-allowed}
.err{color:var(--bad);font-size:.85rem;min-height:1.3em;margin:10px 0 0;text-align:center}
.login-foot{border-top:1px dashed var(--line);margin:14px 24px 0;padding:16px 0 22px;display:grid;gap:10px}
.contact{display:flex;align-items:center;gap:10px;text-decoration:none;font-size:.88rem;color:var(--green);font-weight:500;word-break:break-all}
.contact .dot{flex:none;width:32px;height:32px;border-radius:50%;background:var(--gold-soft);display:grid;place-items:center;color:var(--green)}
.contact .dot svg{width:16px;height:16px}
.contact:hover span{text-decoration:underline}

/* Dashboard */
.hello{text-align:center;margin-bottom:24px;animation:rise .4s ease-out}
.hello h2{font-family:var(--serif);color:var(--green);font-size:clamp(1.5rem,5vw,2.1rem);margin:0 0 4px}
.hello p{margin:0;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media (max-width:560px){.tiles{grid-template-columns:1fr}}
.tile{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;text-decoration:none;color:var(--ink);
  transition:transform .15s,box-shadow .15s,border-color .15s;position:relative;overflow:hidden;animation:rise .45s ease-out both}
.tile:nth-child(2){animation-delay:.05s}.tile:nth-child(3){animation-delay:.1s}.tile:nth-child(4){animation-delay:.15s}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--gold)}
.tile:hover{transform:translateY(-4px);box-shadow:0 22px 34px -22px rgba(11,61,41,.6);border-color:var(--gold)}
.tile:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tile .ico{flex:none;width:58px;height:58px;border-radius:16px;background:linear-gradient(160deg,var(--green),var(--green-2));color:var(--gold-soft);display:grid;place-items:center}
.tile .ico svg{width:28px;height:28px}
.tile h3{margin:0;font-family:var(--serif);font-size:1.15rem;color:var(--green)}
.tile p{margin:3px 0 0;font-size:.84rem;color:var(--muted)}
.tile .go{margin-left:auto;color:var(--gold);flex:none}
.tile .go svg{width:22px;height:22px}
.links{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:26px;font-size:.86rem}
.links .contact{font-size:.86rem}

footer{text-align:center;color:var(--muted);font-size:.78rem;padding:12px 14px calc(18px + env(safe-area-inset-bottom))}
footer a{color:var(--green)}
</style>
</head>
<body>

<header class="topbar">
  <img class="logo" id="logo" alt="RaiKrish's Collection logo">
  <div class="brand"><b>RaiKrish's Collection</b><small>Admin Hub</small></div>
  <div class="spacer"></div>
  <span class="who" id="who" hidden></span>
  <button class="btn-ghost" id="logoutBtn" hidden>Logout</button>
</header>

<main>
  <!-- Login -->
  <section class="login" id="loginView">
    <div class="login-head">
      <img id="loginLogo" alt="RaiKrish's Collection">
      <h1>Admin Login</h1>
      <p>Sign in to manage RaiKrish's Collection</p>
    </div>
    <form class="login-body" id="loginForm" autocomplete="on">
      <div class="field">
        <label for="user">User ID</label>
        <div class="inp">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          <input id="user" type="text" name="username" placeholder="Enter your user ID" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        </div>
      </div>
      <div class="field">
        <label for="pass">Password</label>
        <div class="inp">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="pass" type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="eye" id="eyeBtn" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button class="btn-primary" id="loginBtn" type="submit">Sign in</button>
      <p class="err" id="loginErr" role="alert"></p>
    </form>
    <div class="login-foot">
      <a class="contact" id="siteLink" target="_blank" rel="noopener">
        <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></span>
        <span id="siteText"></span>
      </a>
      <a class="contact" id="mailLink">
        <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/></svg></span>
        <span id="mailText"></span>
      </a>
    </div>
  </section>

  <!-- Dashboard -->
  <section id="homeView" hidden>
    <div class="hello">
      <h2 id="hello">Welcome</h2>
      <p>Choose a tool to get started</p>
    </div>
    <nav class="tiles" id="tiles" aria-label="Admin tools"></nav>
    <div class="links">
      <a class="contact" id="siteLink2" target="_blank" rel="noopener">
        <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></span>
        <span id="siteText2"></span>
      </a>
      <a class="contact" id="mailLink2">
        <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/></svg></span>
        <span id="mailText2"></span>
      </a>
    </div>
  </section>
</main>

<footer>© RaiKrish's Collection · Associated with <a href="https://arnetworkhouse.in/" target="_blank" rel="noopener">AR Network House</a></footer>

<script>
/* ================= CONFIG – edit here ================= */
const CONFIG = {
  LOGO:    'https://drive.google.com/thumbnail?id=1zqOu2NPiGQ4MZT6rxNwbzn_7csTxUQpD&sz=s800',
  WEBSITE: 'https://raikrishcolection.arnetworkhouse.in/',
  EMAIL:   'YOUR_EMAIL@gmail.com',          // <-- put the RaiKrish email here
  SALT:    'raikrish-admin'
};

/* The 4 buttons. Add more objects here any time and they appear automatically. */
const TOOLS = [
  { title: 'Product Manage',    desc: 'Add, edit and organise products',  url: 'https://raikrishscreation-oss.github.io/Raikrish_admin/product_manager/', icon: 'box' },
  { title: 'Invoice Generator', desc: 'Create customer invoices',         url: 'https://raikrishscreation-oss.github.io/Raikrish_admin/invoice/',         icon: 'invoice' },
  { title: 'Order Tracker',     desc: 'Track and update order status',    url: 'https://raikrishscreation-oss.github.io/Raikrish_admin/Orders_details/',  icon: 'truck' },
  { title: 'Invoice Finder',    desc: 'Search past invoices quickly',     url: 'https://raikrishscreation-oss.github.io/Raikrish_admin/invoice_lookup/',  icon: 'search' }
];

/* Users: SHA-256 of  "userid:password:SALT"  (passwords are not stored as plain text).
   To add a user, run in the browser console:  await hashLogin('newuser','newpass')  and paste the result. */
const USERS = {
  anki:  { name: 'Anki',  hash: '347ac5414a3589dccc4cfed7212adf45e1eb897e4e2fabd7989920f86229a01f' },
  ankit: { name: 'Ankit', hash: '9c1fe718d65e7033e33f449e7f07dd5127f7aeb1abd897e431362d311dda6df6' }
};

const MAX_TRIES = 5, LOCK_SECONDS = 30;

/* ================= Icons ================= */
const ICONS = {
  box:     '<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>',
  invoice: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  truck:   '<path d="M2 6h11v10H2z"/><path d="M13 9h4l4 4v3h-8z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  search:  '<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>'
};
const svg = (name, extra) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ' + (extra || '') + '>' + ICONS[name] + '</svg>';
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

const $ = id => document.getElementById(id);

/* ================= Hashing ================= */
async function hashLogin(user, pass) {
  if (!(window.crypto && crypto.subtle)) throw new Error('Secure context needed. Open this page over https.');
  const data = new TextEncoder().encode(String(user).trim().toLowerCase() + ':' + pass + ':' + CONFIG.SALT);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

/* ================= Views ================= */
function showHome(key) {
  const u = USERS[key];
  $('loginView').hidden = true;
  $('homeView').hidden = false;
  $('logoutBtn').hidden = false;
  $('who').hidden = false;
  $('who').textContent = u.name;
  $('hello').textContent = 'Welcome, ' + u.name;
}
function showLogin() {
  $('homeView').hidden = true;
  $('loginView').hidden = false;
  $('logoutBtn').hidden = true;
  $('who').hidden = true;
}
function renderTiles() {
  const box = $('tiles');
  box.innerHTML = '';
  TOOLS.forEach(t => {
    const a = document.createElement('a');
    a.className = 'tile';
    a.href = t.url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.innerHTML = '<div class="ico">' + svg(t.icon) + '</div><div><h3></h3><p></p></div><div class="go">' + ARROW + '</div>';
    a.querySelector('h3').textContent = t.title;
    a.querySelector('p').textContent = t.desc;
    box.appendChild(a);
  });
}
function fillContacts() {
  const host = CONFIG.WEBSITE.replace(/^https?:\/\//, '').replace(/\/$/, '');
  ['', '2'].forEach(s => {
    $('siteLink' + s).href = CONFIG.WEBSITE;
    $('siteText' + s).textContent = host;
    $('mailLink' + s).href = 'mailto:' + CONFIG.EMAIL;
    $('mailText' + s).textContent = CONFIG.EMAIL;
  });
}

/* ================= Login logic ================= */
let tries = 0, lockUntil = 0, lockTimer = null;

function startLock() {
  clearInterval(lockTimer);
  const btn = $('loginBtn');
  btn.disabled = true;
  lockTimer = setInterval(() => {
    const left = Math.ceil((lockUntil - Date.now()) / 1000);
    if (left <= 0) {
      clearInterval(lockTimer);
      tries = 0;
      btn.disabled = false;
      btn.textContent = 'Sign in';
      $('loginErr').textContent = '';
    } else {
      btn.textContent = 'Try again in ' + left + 's';
      $('loginErr').textContent = 'Too many wrong attempts.';
    }
  }, 500);
}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (Date.now() < lockUntil) return;
  const user = $('user').value.trim().toLowerCase();
  const pass = $('pass').value;
  const err = $('loginErr');
  err.textContent = '';
  const btn = $('loginBtn');
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try {
    const h = await hashLogin(user, pass);
    const rec = Object.prototype.hasOwnProperty.call(USERS, user) ? USERS[user] : null;
    if (rec && rec.hash === h) {
      try { sessionStorage.setItem('rk_user', user); } catch (x) {}
      tries = 0;
      $('pass').value = '';
      showHome(user);
    } else {
      tries++;
      err.textContent = 'Wrong user ID or password.';
      $('pass').value = '';
      $('pass').focus();
      if (tries >= MAX_TRIES) { lockUntil = Date.now() + LOCK_SECONDS * 1000; startLock(); return; }
    }
  } catch (ex) {
    err.textContent = ex.message || 'Something went wrong.';
  }
  if (Date.now() >= lockUntil) { btn.disabled = false; btn.textContent = 'Sign in'; }
});

$('eyeBtn').addEventListener('click', () => {
  const p = $('pass');
  const show = p.type === 'password';
  p.type = show ? 'text' : 'password';
  $('eyeBtn').setAttribute('aria-label', show ? 'Hide password' : 'Show password');
});

$('logoutBtn').addEventListener('click', () => {
  try { sessionStorage.removeItem('rk_user'); } catch (x) {}
  showLogin();
  $('user').value = '';
  $('user').focus();
});

/* ================= Boot ================= */
$('logo').src = CONFIG.LOGO;
$('loginLogo').src = CONFIG.LOGO;
fillContacts();
renderTiles();
let saved = '';
try { saved = sessionStorage.getItem('rk_user') || ''; } catch (x) {}
if (saved && Object.prototype.hasOwnProperty.call(USERS, saved)) showHome(saved);
else showLogin();
</script>
</body>
</html>
